spring.application.name = grabseat # Application name
server.port = 8081 # HTTP server port

# Actuator
# Expose all endpoints and disable redis health checks
management.endpoints.web.exposure.include = *
management.health.redis.enabled = false  

# Disable automatic database configuration until PostgreSQL is integrated
# spring.autoconfigure.exclude = org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# PostgreSQL
spring.datasource.url = jdbc:postgresql://localhost:5432/grabseat
spring.datasource.username = grabseat
spring.datasource.password = grabseat

# JPA and Hibernate
# Do not create or modify database tables automatically and display SQL queries in the console
spring.jpa.hibernate.ddl-auto = none 
spring.jpa.show-sql = true 